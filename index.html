<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#20201f" />
    <meta name="description" content="スクリーンショットにプロフィールヘッダーを追加する端末内処理のPWA" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <title>スクショヘッダー</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">H</div>
        <div>
          <h1>スクショヘッダー</h1>
          <p>スクショに、いつもの顔を。</p>
        </div>
      </header>

      <div class="workspace">
        <section class="panel controls">
          <div class="section-heading">
            <span>01</span>
            <div><h2>プロフィール</h2><p>モデルごとに保存して、次から選ぶだけ。</p></div>
          </div>

          <div class="persona-row">
            <label class="field persona-select">
              <span>保存済み</span>
              <select id="personaSelect"></select>
            </label>
            <button id="newPersonaButton" class="icon-button" type="button" aria-label="新しいプロフィール">＋</button>
          </div>

          <div class="profile-editor">
            <label class="icon-picker">
              <input id="iconInput" type="file" accept="image/*" />
              <img id="iconPreview" alt="" hidden />
              <span id="iconPlaceholder">＋</span>
              <small>アイコン</small>
            </label>
            <div class="profile-fields">
              <label class="field"><span>表示名</span><input id="nameInput" placeholder="アシスタント" /></label>
              <div class="split-fields">
                <label class="field"><span>絵文字</span><input id="badgeInput" placeholder="✨" maxlength="8" /></label>
                <label class="field"><span>モデル名</span><input id="modelInput" placeholder="Model X" /></label>
              </div>
            </div>
          </div>
          <div class="profile-actions">
            <button id="savePersonaButton" class="primary-small" type="button">プロフィールを保存</button>
            <button id="deletePersonaButton" class="text-button danger" type="button">削除</button>
          </div>

          <div class="divider"></div>

          <div class="section-heading">
            <span>02</span>
            <div><h2>スクリーンショット</h2><p>複数選択すると、上から順に連結します。</p></div>
          </div>
          <label id="dropZone" class="drop-zone">
            <input id="shotInput" type="file" accept="image/*" multiple />
            <span class="upload-icon">↑</span>
            <strong id="uploadLabel">スクショを選ぶ</strong>
            <small>一度に複数選択できます</small>
          </label>
          <div id="shotList" class="shot-list" hidden></div>

          <div class="divider"></div>

          <div class="section-heading">
            <span>03</span>
            <div><h2>名前隠し・文字置換</h2><p>置換文字を入力してから、隠したい位置をタップ。</p></div>
          </div>
          <div class="replace-row">
            <label class="field">
              <span>置換後の文字（空欄なら色塗り）</span>
              <input id="coverTextInput" value="非公開" placeholder="非公開" />
            </label>
            <button id="coverModeButton" class="primary-small" type="button" disabled>置換位置を指定</button>
          </div>
          <div class="cover-options">
            <div class="size-picker" role="group" aria-label="置換ラベルの横幅">
              <span>置換幅</span>
              <button type="button" data-cover-width="1">1文字</button>
              <button class="selected" type="button" data-cover-width="2">2文字</button>
            </div>
            <label class="continuous-toggle">
              <input id="continuousCoverInput" type="checkbox" />
              連続ぺたぺた
            </label>
          </div>
          <div class="color-picker" role="group" aria-label="置換ラベルの色">
            <span>置換色</span>
            <div id="colorPalette"></div>
          </div>
          <div id="coverActions" class="cover-actions" hidden>
            <span id="coverCount"></span>
            <button id="undoCoverButton" class="text-button" type="button">ひとつ戻す</button>
            <button id="clearCoversButton" class="text-button danger" type="button">すべて消す</button>
          </div>
          <p id="notice" class="notice" aria-live="polite"></p>
        </section>

        <section class="panel preview-panel">
          <div class="preview-title">
            <div class="section-heading">
              <span>04</span>
              <div><h2>できあがり</h2><p id="resultSummary">PNGで保存します。</p></div>
            </div>
            <button id="saveImageButton" class="download-button" type="button" disabled>保存／共有</button>
          </div>
          <div id="canvasStage" class="canvas-stage">
            <canvas id="resultCanvas" aria-label="ヘッダーを追加した画像のプレビュー" hidden></canvas>
            <div id="emptyPreview" class="empty-preview">
              <div class="empty-card"><div class="fake-avatar"></div><div class="fake-line wide"></div><div class="fake-line"></div></div>
              <p>スクショを入れると、ここに完成形が現れます。</p>
            </div>
          </div>
          <p id="tapHint" class="tap-hint" hidden></p>
          <p class="privacy-note">画像もプロフィールも、この端末の中だけで扱います。</p>
        </section>
      </div>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
